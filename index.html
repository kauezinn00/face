<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f0f2f5" />
  <meta name="description" content="Template reutilizável de página Face VSL" />
  <title>Dr. Augusto Valença | VSL</title>
  <style>
    :root{
      --bg:#f0f2f5;
      --card:#fff;
      --text:#050505;
      --muted:#65676b;
      --muted-2:#8a8d91;
      --line:#ced0d4;
      --soft:#f0f2f5;
      --soft-2:#e4e6eb;
      --blue:#1877f2;
      --green:#22a447;
      --danger:#f02849;
      --warning:#f7b928;
      --max:680px;
      --shadow:0 1px 2px rgba(0,0,0,.12);
      --radius:10px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}

    .topbar{
      position:sticky;top:0;z-index:50;
      background:#fff;border-bottom:1px solid var(--line);
      box-shadow:0 1px 2px rgba(0,0,0,.06);
      height:56px;
      display:flex;align-items:center;justify-content:center;
    }
    .topbar-inner{width:min(100%,var(--max));display:flex;align-items:center;justify-content:space-between;padding:0 12px}
    .brand{display:flex;align-items:center;gap:8px;min-width:0}
    .brand-mark{
      width:40px;height:40px;border-radius:50%;background:var(--blue);
      display:grid;place-items:center;color:#fff;font-size:27px;font-weight:800;line-height:1;
      font-family:Arial,sans-serif;
    }
    .brand-text{font-size:26px;font-weight:700;color:var(--blue);letter-spacing:-.5px;line-height:1}
    .top-actions{display:flex;gap:8px}
    .circle-btn{width:40px;height:40px;border:0;border-radius:50%;background:var(--soft-2);display:grid;place-items:center;color:#1c1e21;padding:0}
    .circle-btn svg{width:20px;height:20px}

    main{width:min(100%,var(--max));margin:16px auto 52px;padding:0 10px}
    .post,.offer{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

    .post-head{display:flex;gap:9px;align-items:flex-start;padding:12px 16px 7px}
    .avatar,.mini-avatar{position:relative;flex:0 0 auto;overflow:hidden;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dce7ff,#bed2ff);color:#315ba2;font-weight:700}
    .avatar{width:40px;height:40px;font-size:14px;border:1px solid rgba(0,0,0,.05)}
    .mini-avatar{width:32px;height:32px;font-size:11px;border:1px solid rgba(0,0,0,.05)}
    .reply .mini-avatar{width:24px;height:24px;font-size:10px}
    .avatar img,.mini-avatar img{width:100%;height:100%;object-fit:cover}
    .identity{min-width:0;flex:1}
    .identity-line{display:flex;align-items:center;gap:4px;min-width:0}
    .page-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.08px}
    .verified{width:18px;height:18px;display:inline-grid;place-items:center;background:var(--blue);color:#fff;flex:0 0 auto;clip-path:polygon(50% 0%,64% 8%,79% 6%,88% 18%,100% 28%,96% 43%,100% 58%,88% 68%,79% 81%,64% 92%,50% 100%,36% 92%,21% 81%,12% 68%,0% 58%,4% 43%,0% 28%,12% 18%,21% 6%,36% 8%)}
    .verified svg{width:11px;height:11px}
    .meta{margin-top:2px;display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;line-height:1}
    .meta .globe{display:inline-grid;place-items:center;color:var(--muted)}
    .meta .globe svg{width:12px;height:12px}
    .kebab{background:transparent;border:0;color:var(--muted);padding:4px;margin:-4px -4px 0 0;line-height:1;display:grid;place-items:center}
    .kebab svg{width:20px;height:20px}

    .post-copy{padding:1px 16px 12px;font-size:15px;line-height:1.38;white-space:pre-line;letter-spacing:-.05px}

    .video-shell{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden}
    .video-shell video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
    .video-placeholder{position:absolute;inset:0;border:0;color:#fff;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at center, rgba(46,52,64,.55), rgba(0,0,0,.88));padding:24px}
    .video-placeholder.hidden{display:none}
    .play-orb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);color:#111;margin:0 auto 12px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
    .play-orb svg{width:28px;height:28px;margin-left:4px}
    .video-placeholder strong{display:block;font-size:20px;line-height:1.15}
    .video-placeholder small{display:block;opacity:.86;margin-top:8px;font-size:13px}

    .engagement{padding:9px 16px 8px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line);gap:8px}
    .reactions{display:flex;align-items:center;gap:6px;min-width:0}
    .reaction-stack{display:flex;align-items:center;position:relative}
    .reaction-chip{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #fff;margin-left:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
    .reaction-chip:first-child{margin-left:0}
    .reaction-chip svg{width:18px;height:18px}
    .social-stats{display:flex;gap:8px;white-space:nowrap;flex-wrap:wrap;justify-content:flex-end}.social-stats span:hover,#likeCountLabel:hover{text-decoration:underline;cursor:default}

    .action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px 8px 4px;border-bottom:1px solid var(--line)}
    .action{border:0;background:transparent;border-radius:6px;padding:7px 6px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s ease,color .15s ease}
    .action:hover{background:#f2f3f5}
    .action.active{color:var(--blue)}
    .action svg{width:18px;height:18px;flex:0 0 auto}

    .comments{padding:9px 12px 14px}
    .comment-sort{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:9px}
    .comment-sort .caret{font-size:12px;transform:translateY(-1px)}
    .comment-composer{display:flex;gap:8px;margin-bottom:12px}
    .composer-box{position:relative;flex:1}
    .composer-input{width:100%;border:0;outline:0;background:var(--soft);border-radius:18px;padding:9px 102px 9px 12px;color:var(--text)}
    .composer-tools{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:7px;align-items:center}
    .send-comment{border:0;background:transparent;color:var(--blue);font-weight:700;padding:2px 0;line-height:1}
    .tiny-icon{display:grid;place-items:center;color:var(--muted-2)}
    .tiny-icon svg{width:18px;height:18px}

    .comment,.reply{display:flex;gap:8px;margin-top:12px}
    .reply-thread{margin-left:38px;border-left:2px solid #e4e6eb;padding-left:8px}
    .reply{margin-top:8px}
    .comment-body{min-width:0;flex:1}
    .bubble-wrap{display:inline-flex;align-items:flex-end;position:relative;max-width:100%}
    .bubble{display:inline-block;max-width:100%;background:var(--soft);border-radius:18px;padding:7px 11px 8px;position:relative}
    .comment-name{font-size:13px;font-weight:700;margin-bottom:1px;line-height:1.2}
    .comment-text{font-size:14px;line-height:1.34;white-space:pre-line}
    .reply .comment-text{font-size:13px}
    .comment-pill{position:absolute;right:-10px;bottom:-8px;background:#fff;border:1px solid #dadde1;border-radius:12px;display:inline-flex;align-items:center;gap:3px;padding:1px 6px 1px 3px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
    .comment-pill-icon{width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
    .comment-pill-icon svg{width:16px;height:16px}
    .comment-pill-count{font-size:12px;color:var(--muted);font-weight:600;line-height:1}
    .comment-actions{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;font-weight:600;padding:4px 8px 0}
    .comment-like{border:0;background:transparent;color:inherit;font-weight:600;padding:0}
    .comment-like.active{color:var(--blue)}
    .comment-likes{white-space:nowrap}
    .load-more{margin-top:14px;background:transparent;border:0;padding:0;color:var(--muted);font-weight:600;font-size:14px}

    .offer{margin-top:14px;padding:18px 16px;text-align:center;display:none}
    .offer.visible{display:block;animation:reveal .3s ease both}
    @keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .offer-kicker{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--blue)}
    .offer h2{font-size:24px;line-height:1.1;margin:7px auto 8px;max-width:560px}
    .offer p{margin:0 auto 14px;color:var(--muted);font-size:15px;line-height:1.4;max-width:560px}
    .cta{border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:800;font-size:15px;padding:13px 18px;width:min(100%,520px);display:inline-block;box-shadow:0 4px 0 rgba(0,0,0,.13);transition:.16s ease}
    .cta:hover{filter:brightness(.98);transform:translateY(-1px)}
    .cta:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.13)}
    .microcopy{font-size:12px;color:var(--muted);margin-top:9px}

    .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:#1c1e21;color:#fff;border-radius:9px;padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s ease;z-index:99;max-width:calc(100vw - 28px);text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .footer-note{color:#8a8d91;text-align:center;font-size:11px;line-height:1.45;padding:24px 12px}

    @media (max-width:560px){
      body{background:#fff}
      .topbar{height:52px}
      .topbar-inner{padding:0 10px}
      .brand-mark{width:36px;height:36px;font-size:24px}
      .brand-text{font-size:24px}
      .circle-btn{width:36px;height:36px}
      main{padding:0;margin:0 auto 28px}
      .post,.offer{border-radius:0;box-shadow:none}
      .post-head,.post-copy,.engagement{padding-left:12px;padding-right:12px}
      .comments{padding-left:12px;padding-right:12px}
      .offer{border-top:8px solid var(--bg);margin-top:0;padding:20px 14px 22px}
      .social-stats{font-size:13px}
      .composer-input{padding-right:92px}
      .reply-thread{margin-left:18px;padding-left:7px}
      .comment-pill{right:-6px}
      .footer-note{padding-bottom:34px}
    }

    .video-shell video {display:block;object-fit:cover;width:100%;height:100%;background:#000;pointer-events:none;}
    .video-shell video::-webkit-media-controls, .video-shell video::-webkit-media-controls-enclosure {display:none!important;}
    .player-progress {position:absolute;left:0;right:0;bottom:0;z-index:9;height:7px;background:rgba(255,255,255,.33);pointer-events:none;}
    .player-progress-fill {height:100%;width:0%;background:linear-gradient(90deg,#1877f2,#5db1ff);box-shadow:0 0 10px rgba(24,119,242,.45);transition:width .28s linear;}
    .sound-gate {position:absolute;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;background:transparent;padding:20px 14px 42px;text-align:center;pointer-events:none;}
    .sound-gate[hidden] {display:none!important;}
    .sound-activate {display:block;width:min(90%,380px);max-width:90%;background:transparent;border:none;padding:0;margin:0;box-shadow:none;animation:soundOverlayPulse 1.25s ease-in-out infinite;transform-origin:center;pointer-events:none;}
    .sound-activate img{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 34px rgba(0,0,0,.28));}
    .sound-activate svg{display:none!important;}
    .sound-hidden-copy{display:none!important;}
    .sound-hint {display:none!important;}
    .video-loader {display:none;position:absolute;top:16px;right:16px;z-index:6;width:26px;height:26px;border:3px solid rgba(255,255,255,.35);border-top-color:white;border-radius:50%;animation:spin .85s linear infinite;pointer-events:none;}
    .video-shell.is-buffering .video-loader {display:block;}
    @keyframes spin {to{transform:rotate(360deg)}}
    @keyframes soundOverlayPulse {0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @media (prefers-reduced-motion:reduce){.sound-activate{animation:none}.player-progress-fill{transition:none}}
    @media(max-width:560px) {.sound-activate{width:min(92%,350px)}.video-shell {max-width:404px}}
  
    .offer{
      margin:0;
      padding:14px 12px 12px;
      text-align:center;
      display:none;
      background:#fff;
      box-shadow:none;
      border-radius:0;
    }
    .offer.visible{
      display:block;
      animation:reveal .25s ease both;
    }
    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:min(100%,520px);
      min-height:54px;
      padding:14px 22px;
      border-radius:12px;
      background:#22a447;
      color:#fff;
      font-size:17px;
      font-weight:800;
      text-decoration:none;
      box-shadow:0 4px 0 rgba(0,0,0,.14);
      border:0;
    }
    .cta-pulse{
      animation:ctaPulse 1.35s ease-in-out infinite;
      transform-origin:center;
    }
    @keyframes ctaPulse{
      0%,100%{transform:scale(1);box-shadow:0 4px 0 rgba(0,0,0,.14),0 0 0 0 rgba(34,164,71,.30)}
      50%{transform:scale(1.035);box-shadow:0 4px 0 rgba(0,0,0,.14),0 0 0 10px rgba(34,164,71,0)}
    }

  
    /* CTA sobre o player: aparece após o tempo configurado e fica acima da barra fake */
    .video-shell .offer{
      position:absolute;
      left:50%;
      right:auto;
      bottom:108px;
      width:100%;
      transform:translateX(-50%);
      z-index:14;
      margin:0;
      padding:0;
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:10px;
      background:transparent;
      box-shadow:none;
      border-radius:0;
      pointer-events:none;
    }
    .video-shell .offer.visible{
      display:flex;
      animation:ctaReveal .24s ease-out both;
    }
    .video-shell .offer-kicker{
      pointer-events:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      max-width:min(84%,390px);
      padding:7px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.76);
      color:#fff;
      font-size:12px;
      font-weight:800;
      letter-spacing:.03em;
      line-height:1.2;
      text-align:center;

    const $ = (sel) => document.querySelector(sel);
    const fmt = (n) => n >= 1000 ? (n / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : n.toLocaleString("pt-BR");
    let likes = CONFIG.initialLikes, commentsCount = CONFIG.initialComments, shares = CONFIG.initialShares;
    let liked = false, shareRegistered = false, watchedSeconds = 0, lastVideoTime = 0, ctaRevealed = false, commentsRendered = 0;

    function initialsFromName(name){ return name.trim().split(/\s+/).slice(0,2).map(x => x[0]?.toUpperCase() || "").join("") || "PV"; }
    function escapeHtml(str){ return String(str).replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[ch])); }
    function toast(msg){ const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1800); }
    function updateCounts(){ $("#likeCountLabel").textContent = fmt(likes); $("#commentCountLabel").textContent = fmt(commentsCount); $("#shareCountLabel").textContent = fmt(shares); }
    function revealCTA(){ if (ctaRevealed) return; ctaRevealed = true; $("#offerSection").classList.add("visible"); }
    function reactionIcon(type){
      if(type === 'love') return '<span class="comment-pill-icon"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#f02849"/><path fill="#fff" d="M10 14.8l-.58-.53C6.1 11.26 4 9.35 4 7 4 5.35 5.35 4 7 4c.93 0 1.82.43 2.4 1.11C9.98 4.43 10.87 4 11.8 4 13.45 4 14.8 5.35 14.8 7c0 2.35-2.1 4.26-5.42 7.27L10 14.8z"/></svg></span>';
      return '<span class="comment-pill-icon"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#1877f2"/><path fill="#fff" d="M8.5 16h5.04c.74 0 1.38-.52 1.54-1.24l.91-4A1.57 1.57 0 0014.46 9H12V6.66c0-.9-.7-1.66-1.57-1.66-.31 0-.61.12-.83.34L7 7.92V16h1.5zM4 16h2V8H4v8z"/></svg></span>';
    }
    function reactionPillMarkup(reactions = [], count = 0){
      if(!count) return '';
      const uniq = [...new Set(reactions)].slice(0,2);
      return `<span class="comment-pill">${uniq.map(reactionIcon).join('')}<span class="comment-pill-count">${count}</span></span>`;
    }
    function avatarMarkup(item, reply=false){
      const cls = reply ? 'mini-avatar' : 'mini-avatar';
      const initials = escapeHtml(item.initials || initialsFromName(item.name || CONFIG.pageName));
      if(item.avatarUrl) return `<div class="${cls}"><img src="${escapeHtml(item.avatarUrl)}" alt="" loading="lazy" decoding="async"></div>`;
      return `<div class="${cls}">${initials}</div>`;
    }

    function buildCommentNode(c, isReply=false){
      const wrap = document.createElement('div');
      wrap.className = isReply ? 'reply' : 'comment';
      const likeTotal = Number(c.likes || 0);
      const reactions = Array.isArray(c.reactions) ? [...c.reactions] : [];
      wrap.innerHTML = `
        ${avatarMarkup(c, isReply)}
        <div class="comment-body">
          <div class="bubble-wrap">
            <div class="bubble">
              <div class="comment-name">${escapeHtml(c.name)}</div>
              <div class="comment-text">${escapeHtml(c.text)}</div>
            </div>
            ${reactionPillMarkup(reactions, likeTotal)}
          </div>
          <div class="comment-actions">
            <button class="comment-like" type="button">Curtir</button>
            <span>Responder</span>
            <span>${escapeHtml(c.time || 'Agora')}</span>
            <span class="comment-likes">${likeTotal > 0 ? `· ${likeTotal.toLocaleString('pt-BR')} curtidas` : ''}</span>
          </div>
        </div>`;
      const likeBtn = wrap.querySelector('.comment-like');
      const likesLabel = wrap.querySelector('.comment-likes');
      const bubbleWrap = wrap.querySelector('.bubble-wrap');
      let total = likeTotal, on = false;
      likeBtn.addEventListener('click', () => {
        on = !on;
        total += on ? 1 : -1;
        likeBtn.classList.toggle('active', on);
        likesLabel.textContent = total > 0 ? `· ${total.toLocaleString('pt-BR')} curtidas` : '';
        const existing = bubbleWrap.querySelector('.comment-pill');
        if(existing) existing.remove();
        const nextReactions = [...reactions];
        if(on && !nextReactions.includes('like')) nextReactions.unshift('like');
        if(total > 0) bubbleWrap.insertAdjacentHTML('beforeend', reactionPillMarkup(nextReactions, total));
      });

      if(Array.isArray(c.replies) && c.replies.length){
        const thread = document.createElement('div');
        thread.className = 'reply-thread';
        c.replies.forEach(r => thread.appendChild(buildCommentNode(r, true)));
        wrap.querySelector('.comment-body').appendChild(thread);
      }
      return wrap;
    }

    function renderMoreComments(count = CONFIG.commentsPerPage){
      const list = $('#commentsList');
      const end = Math.min(commentsRendered + count, CONFIG.comments.length);
      for(let i = commentsRendered; i < end; i++) list.appendChild(buildCommentNode(CONFIG.comments[i]));
      commentsRendered = end;
      $('#loadMoreBtn').style.display = commentsRendered >= CONFIG.comments.length ? 'none' : 'inline-block';
    }

    function init(){
      document.title = CONFIG.pageName;
      if ($('#brandText')) $('#brandText').textContent = CONFIG.brandText;
      $('#pageName').textContent = CONFIG.pageName;
      $('#followers').textContent = CONFIG.followersText;
      $('#verifiedBadge').style.display = CONFIG.verified ? 'inline-grid' : 'none';
      $('#postCopy').textContent = CONFIG.postText;
$('#cta').textContent = CONFIG.ctaText;
      $('#cta').href = CONFIG.ctaUrl || '#';
$('#selfAvatar').textContent = CONFIG.selfAvatarText;
      const avatar = $('#avatar');
      $('#avatarInitials').textContent = initialsFromName(CONFIG.pageName);
      if(CONFIG.avatarUrl) avatar.innerHTML = `<img src="${escapeHtml(CONFIG.avatarUrl)}" alt="Foto do perfil" loading="eager" decoding="async">`;
      const v = $('#vsl');
      v.controls = false; // Never show the browser's controls
      renderMoreComments();
      updateCounts();
      if(CONFIG.ctaDelaySeconds <= 0) revealCTA();
    }

    $('#likeBtn').addEventListener('click', () => { liked = !liked; likes += liked ? 1 : -1; $('#likeBtn').classList.toggle('active', liked); updateCounts(); toast(liked ? 'Você curtiu esta publicação' : 'Curtida removida'); });
    $('#commentBtn').addEventListener('click', () => { $('#commentInput').focus(); $('#commentInput').scrollIntoView({behavior:'smooth', block:'center'}); });
    $('#shareBtn').addEventListener('click', async () => {
      if(!shareRegistered){ shares += 1; shareRegistered = true; updateCounts(); }
      const data = { title: document.title, text: 'Veja este vídeo', url: location.href };
      try {
        if(navigator.share) await navigator.share(data);
        else { await navigator.clipboard.writeText(location.href); toast('Link copiado para compartilhar'); }
      } catch(e) { if(e?.name !== 'AbortError') toast('Compartilhamento indisponível neste navegador'); }
    });
    function sendComment(){
      const input = $('#commentInput');
      const text = input.value.trim();
      if(!text) return;
      $('#commentsList').prepend(buildCommentNode({ name:'Você', initials:'VC', text, time:'Agora', likes:0, reactions:[] }));
      input.value = '';
      commentsCount += 1;
      updateCounts();
      toast('Comentário publicado nesta página');
    }
    $('#sendComment').addEventListener('click', sendComment);
    $('#commentInput').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendComment(); } });
    $('#loadMoreBtn').addEventListener('click', () => renderMoreComments());


    // V7 player: intentionally simple for static Vercel hosting.
    const video = $('#vsl');
    const soundGate = $('#soundGate');
    const soundText = $('#soundButtonText');
    const soundHint = $('#soundHint');
    const playerShell = $('#videoShell');
    const progressFill = $('#progressFill');
    let soundEnabled = false;
    let videoStarted = false;

    video.controls = false;
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');

    function setGateText() {
      soundGate.hidden = false;
      soundText.textContent = 'TOQUE PARA ATIVAR O SOM';
      soundHint.textContent = videoStarted ? 'O vídeo está rodando sem som' : 'Toque no vídeo para começar com som';
    }

    async function startMuted() {
      if (soundEnabled) return;
      video.muted = true;
      video.defaultMuted = true;
      video.setAttribute('muted', '');
      setGateText();
      try {
        await video.play();
      } catch (_) {
        // The first real tap below is the fallback.
      }
    }

    async function enableSoundFromStart() {
      if (soundEnabled) return;
      try {
        video.currentTime = 0;
      } catch (_) {}
      video.muted = false;
      video.defaultMuted = false;
      video.removeAttribute('muted');
      video.volume = 1;
      try {
        await video.play();
        soundEnabled = true;
        soundGate.hidden = true;
      } catch (_) {
        // If sound autoplay is refused, the same user gesture should still
        // start the media muted rather than leave a black player.
        video.muted = true;
        video.defaultMuted = true;
        video.setAttribute('muted', '');
        try { await video.play(); } catch (_) {}
        setGateText();
      }
    }

    playerShell.addEventListener('click', (event) => {
      if (!soundEnabled) {
        event.preventDefault();
        enableSoundFromStart();
      }
    });

    video.addEventListener('loadstart', () => playerShell.classList.add('is-buffering'));
    video.addEventListener('waiting', () => playerShell.classList.add('is-buffering'));
    video.addEventListener('stalled', () => playerShell.classList.add('is-buffering'));
    video.addEventListener('playing', () => {
      videoStarted = true;
      playerShell.classList.remove('is-buffering');
      if (!soundEnabled) setGateText();
    });
    video.addEventListener('loadeddata', () => {
      playerShell.classList.remove('is-buffering');
      startMuted();
    }, { once:true });
    video.addEventListener('canplay', () => {
      playerShell.classList.remove('is-buffering');
      if (!soundEnabled && video.paused) startMuted();
    });
    video.addEventListener('error', () => {
      playerShell.classList.remove('is-buffering');
      soundGate.hidden = false;
      soundText.textContent = 'TOQUE PARA TENTAR O VÍDEO';
      soundHint.textContent = 'Se continuar preto, o MP4 não foi publicado junto com a página';
    });

    function updateVisualProgress() {
      const duration = Number(video.duration) || 0;
      const fraction = duration ? Math.min(1, Math.max(0, video.currentTime / duration)) : 0;
      const eased = 0.87 * (1 - Math.pow(1 - fraction, 3.1)) + 0.13 * fraction;
      progressFill.style.width = `${Math.min(100, Math.max(0, eased * 100)).toFixed(2)}%`;
    }

    video.addEventListener('timeupdate', () => {
      const now = video.currentTime || 0;
      const delta = now - lastVideoTime;
      if (delta > 0 && delta < 1.5 && !video.paused) watchedSeconds += delta;
      lastVideoTime = now;
      updateVisualProgress();
      if (watchedSeconds >= CONFIG.ctaDelaySeconds) revealCTA();
    });
    video.addEventListener('seeking', () => { lastVideoTime = video.currentTime || 0; });
    video.addEventListener('ended', () => { progressFill.style.width = '100%'; revealCTA(); });

    init();
    setGateText();
    startMuted();
    window.addEventListener('load', startMuted, { once:true });
    $('#cta').addEventListener('click', e => { if(!CONFIG.ctaUrl || CONFIG.ctaUrl === '#'){ e.preventDefault(); toast('Defina o checkout em CONFIG.ctaUrl'); } });
  </script>
</body>
</html>
